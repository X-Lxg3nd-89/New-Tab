<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Give Your Website a Pulse - New Tab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            margin: 0;
        }

        #bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            z-index: -2;
        }

        #bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
        }

        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 20px;
        }

        .btn-primary {
            background-color: #3b82f6;
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
        }

        .btn-primary:hover {
            background-color: #2563eb;
        }

        .btn-danger {
            color: #f87171;
            font-size: 12px;
        }

        .btn-danger:hover {
            color: #ef4444;
        }
    </style>
</head>
<body class="flex flex-col justify-between p-4 md:p-8 min-h-screen">

    <div id="bg-image"></div>
    <div id="bg-overlay"></div>

    <header class="flex justify-between items-center mb-6">
        <div class="flex items-center gap-2">
            <span class="bg-blue-600 text-white text-xs font-bold px-2 py-1 rounded">MISSION</span>
            <span class="text-sm font-semibold tracking-wide">Give Your Website a Pulse</span>
        </div>
        <div class="text-xs text-slate-300 bg-slate-800 px-3 py-1.5 rounded border border-slate-700" id="apod-title">
            Loading NASA APOD...
        </div>
    </header>

    <main class="max-w-4xl mx-auto w-full flex-1 flex flex-col justify-center gap-8">
        
        <div class="text-center space-y-2">
            <h1 id="clock" class="text-6xl md:text-7xl font-bold text-white tracking-tight">
                00:00:00
            </h1>
            <p id="greeting" class="text-xl text-slate-300 font-medium">
                Welcome back!
            </p>
        </div>

        <div class="card max-w-xl mx-auto w-full">
            <form id="search-form" class="flex gap-2">
                <select id="search-engine" class="bg-slate-900 border border-slate-700 text-slate-200 text-sm rounded px-3 py-2">
                    <option value="google">Google</option>
                    <option value="ddg">DuckDuckGo</option>
                </select>
                <input 
                    type="text" 
                    id="search-input" 
                    placeholder="Search the web..." 
                    class="flex-1 bg-slate-900 border border-slate-700 text-white text-sm rounded px-3 py-2 focus:outline-none focus:border-blue-500"
                    required
                >
                <button type="submit" class="btn-primary">Search</button>
            </form>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <div class="card flex flex-col justify-between">
                <div>
                    <h2 class="text-base font-bold text-white mb-4 border-b border-slate-700 pb-2">Quick Links</h2>
                    <div id="links-list" class="grid grid-cols-2 gap-2 mb-4"></div>
                </div>

                <form id="add-link-form" class="flex gap-2 pt-2 border-t border-slate-700">
                    <input type="text" id="link-name" placeholder="Name" class="w-1/3 bg-slate-900 border border-slate-700 text-xs text-white rounded px-2 py-1.5" required>
                    <input type="url" id="link-url" placeholder="https://..." class="w-2/3 bg-slate-900 border border-slate-700 text-xs text-white rounded px-2 py-1.5" required>
                    <button type="submit" class="bg-slate-700 hover:bg-slate-600 text-white text-xs px-3 py-1.5 rounded">+</button>
                </form>
            </div>

            <div class="card flex flex-col justify-between">
                <div>
                    <div class="flex justify-between items-center mb-4 border-b border-slate-700 pb-2">
                        <h2 class="text-base font-bold text-white">Daily Missions</h2>
                        <span id="todo-count" class="text-xs text-slate-400">0 tasks</span>
                    </div>
                    <ul id="todo-list" class="space-y-2 mb-4 max-h-40 overflow-y-auto"></ul>
                </div>

                <form id="add-todo-form" class="flex gap-2 pt-2 border-t border-slate-700">
                    <input type="text" id="todo-input" placeholder="New goal for today..." class="flex-1 bg-slate-900 border border-slate-700 text-xs text-white rounded px-2 py-1.5" required>
                    <button type="submit" class="bg-slate-700 hover:bg-slate-600 text-white text-xs px-3 py-1.5 rounded">Add Task</button>
                </form>
            </div>

        </div>

    </main>

    <footer class="mt-8 text-center text-xs text-slate-500">
        Simple New Tab Page &bull; Created with love and skill :D
    </footer>

    <script>
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds}`;

            const currentHour = now.getHours();
            const greetingEl = document.getElementById('greeting');

            if (currentHour < 12) {
                greetingEl.textContent = "Good Morning!";
            } else if (currentHour < 18) {
                greetingEl.textContent = "Good Afternoon!";
            } else {
                greetingEl.textContent = "Good Evening!";
            }
        }

        setInterval(updateClock, 1000);
        updateClock();

        const fallbackImage = "https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=1600&auto=format&fit=crop";

        async function loadNasaBackground() {
            const apodTitle = document.getElementById('apod-title'); 
            const bgImage = document.getElementById('bg-image');

            try {
                const response = await fetch("https://api.nasa.gov/planetary/apod?api_key=DEMO_KEY");
                if (!response.ok) {
                    throw new Error("API rate limit or network error");
                }
                const data = await response.json();

                if (data.media_type === "image") {
                    bgImage.style.backgroundImage = `url('${data.url}')`;
                    apodTitle.textContent = `APOD: ${data.title}`;
                } else {
                    bgImage.style.backgroundImage = `url('${fallbackImage}')`;
                    apodTitle.textContent = "NASA Space View";
                }
            } catch (error) {
                console.log("Using fallback background image:", error);
                bgImage.style.backgroundImage = `url('${fallbackImage}')`;
                apodTitle.textContent = "Deep Space View";
            }
        }

        loadNasaBackground();

        document.getElementById('search-form').addEventListener('submit', function(event) {
            event.preventDefault();
            const query = document.getElementById('search-input').value.trim();
            const engine = document.getElementById('search-engine').value;

            if (!query) return;

            if (engine === 'google') {
                window.location.href = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
            } else {
                window.location.href = `https://duckduckgo.com/?q=${encodeURIComponent(query)}`;
            }
        });

        const defaultLinks = [
            { name: "GitHub", url: "https://github.com" },
            { name: "YouTube", url: "https://youtube.com" },
            { name: "MDN Web Docs", url: "https://developer.mozilla.org" }
        ];

        let quickLinks = JSON.parse(localStorage.getItem('my_links')) || defaultLinks;

        function renderLinks() {
            const container = document.getElementById('links-list');
            container.innerHTML = '';

            quickLinks.forEach((item, index) => {
                const linkDiv = document.createElement('div');
                linkDiv.className = "flex items-center justify-between bg-slate-900 border border-slate-700 rounded px-3 py-2 text-xs";
                linkDiv.innerHTML = `
                    <a href="${item.url}" target="_blank" class="text-blue-400 hover:underline font-medium truncate">${item.name}</a>
                    <button onclick="removeLink(${index})" class="btn-danger ml-2">✕</button>
                `;
                container.appendChild(linkDiv);
            });
        }

        function removeLink(index) {
            quickLinks.splice(index, 1);
            localStorage.setItem('my_links', JSON.stringify(quickLinks));
            renderLinks();
        }

        document.getElementById('add-link-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const nameInput = document.getElementById('link-name');
            const urlInput = document.getElementById('link-url');

            let url = urlInput.value.trim();
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }

            quickLinks.push({ name: nameInput.value.trim(), url: url });
            localStorage.setItem('my_links', JSON.stringify(quickLinks));

            renderLinks();
            nameInput.value = '';
            urlInput.value = '';
        });

        renderLinks();

        const defaultTodos = [
            { text: "Finish HTML page structure", completed: true },
            { text: "Test NASA APOD API", completed: false }
        ];

        let todoTasks = JSON.parse(localStorage.getItem('my_todos')) || defaultTodos;

        function renderTodos() {
            const list = document.getElementById('todo-list');
            const countLabel = document.getElementById('todo-count');
            list.innerHTML = '';

            let completedCount = 0;

            todoTasks.forEach((task, index) => {
                if (task.completed) completedCount++;
                const li = document.createElement('li');
                li.className = "flex items-center justify-between bg-slate-900 border border-slate-700 rounded p-2 text-xs";
                li.innerHTML = `
                    <label class="flex items-center gap-2 cursor-pointer flex-1">
                        <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTodo(${index})" class="rounded">
                        <span class="${task.completed ? 'line-through text-slate-500' : 'text-slate-200'}">${task.text}</span>
                    </label>
                    <button onclick="removeTodo(${index})" class="btn-danger ml-2">Delete</button>
                `;
                list.appendChild(li);
            });

            countLabel.textContent = `${completedCount}/${todoTasks.length} done`;
        }

        function toggleTodo(index) {
            todoTasks[index].completed = !todoTasks[index].completed;
            localStorage.setItem('my_todos', JSON.stringify(todoTasks));
            renderTodos();
        }

        function removeTodo(index) {
            todoTasks.splice(index, 1);
            localStorage.setItem('my_todos', JSON.stringify(todoTasks));
            renderTodos();
        }

        document.getElementById('add-todo-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const input = document.getElementById('todo-input');
            const text = input.value.trim();

            if (!text) return;

            todoTasks.push({ text: text, completed: false });
            localStorage.setItem('my_todos', JSON.stringify(todoTasks));

            renderTodos();
            input.value = '';
        });

        renderTodos();
    </script>
</body>
</html>
